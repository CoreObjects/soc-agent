<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>全场景安全告警研判知识图谱 · 图模型 1.0</title>
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<style>
  :root { --panel: 340px; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color:#1e293b; }
  #wrap { display:flex; height:100vh; }
  #cy { flex:1; height:100%; background:#f8fafc; }
  #side { width:var(--panel); height:100%; overflow:auto; border-left:1px solid #e2e8f0; padding:14px 16px; }
  h1 { font-size:16px; margin:0 0 2px; }
  .sub { color:#64748b; font-size:12px; margin-bottom:12px; }
  h2 { font-size:13px; margin:16px 0 6px; border-bottom:1px solid #e2e8f0; padding-bottom:4px; }
  .chip { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; color:#fff; margin:2px 3px 2px 0; }
  .row { font-size:12px; margin:3px 0; }
  .k { color:#64748b; }
  label.f { display:block; font-size:12px; margin:3px 0; cursor:pointer; }
  label.f input { vertical-align:middle; margin-right:6px; }
  .swatch { display:inline-block; width:11px; height:11px; border-radius:2px; vertical-align:middle; margin-right:5px; }
  #nodeinfo { font-size:12px; background:#f1f5f9; border-radius:6px; padding:8px; min-height:34px; }
  #nodeinfo .t { font-weight:bold; }
  .cov { font-size:11px; margin:4px 0; padding-left:14px; text-indent:-14px; }
  .ok { color:#16a34a; }
  .note { font-size:11px; color:#94a3b8; margin-top:6px; }
  button { font-size:12px; padding:4px 8px; margin:2px 0; cursor:pointer; }
  #warn { position:absolute; top:10px; left:10px; background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; padding:8px 12px; border-radius:6px; font-size:12px; display:none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="cy"></div>
  <div id="warn">Cytoscape 未加载（可能离线/CDN 被墙）。请联网后刷新，或改用本地 vendored 版本。</div>
  <div id="side">
    <h1>安全告警研判知识图谱</h1>
    <div class="sub">图模型 <b>1.0</b> · 已锁定 (LOCKED · 定稿)<br/>生成自 <code>model/graph_model.json</code>（单一事实源）</div>

    <div id="nodeinfo">点击节点查看 属性 / 键</div>

    <h2>层（点色块可高亮）</h2>
    <div id="layers"></div>

    <h2>边类型过滤</h2>
    <div id="cats"></div>
    <label class="f"><input type="checkbox" id="showDeferred"/> 显示研判扩展层(延后)</label>

    <h2>连接键 vs 关联规则</h2>
    <div id="keys"></div>

    <h2>典型告警覆盖（12 类）</h2>
    <div id="cov"></div>

    <div class="note">节点 32 · 边类型 62。虚线框/虚线边 = 研判扩展层(第一阶段可不落库)。</div>
  </div>
</div>
<script>
const MODEL = {"$schema_note": "全场景安全告警研判知识图谱 · 单一事实源(Single Source of Truth)。文档(docs/graph-model/design-v0.3.md)与可视化(model/graph-model.html)均由本文件派生。改模型只改此文件。", "version": "1.0", "status": "已锁定 (LOCKED · 定稿)", "principles": ["四类对象严格分层：观测事实(对象/事件) / 资源 / 富化知识 / 研判产物", "对象 vs 事件：有动作/时间/因果-相关之争/需跨源融合者一律事件化", "单一事实源：本 JSON 权威，文档与图从此派生", "稳定核心 + 场景扩展：新场景加实体/关系而非重构", "经验复用检索 = 图召回相似(pattern_key/AttackPattern → 相似 Alert/Case/Experience) + RAG 读经验文本 + Agent 判适用；图负责找准场景，RAG 读懂文本，Agent 判能否套用"], "meta_fields": {"observation": ["raw_ref", "source", "sensor", "event_time", "ingest_time", "confidence"], "event_only": ["event_uid", "event_code"], "temporal_validity": ["valid_from", "valid_to", "source", "updated_at"], "notes": {"observation": "所有观测事件节点必带；逻辑抽象，不强制作为图库真实标签", "event_uid": "唯一事件标识 = hash(source + sensor + record_id + event_time + raw_ref)。强键。", "event_code": "事件类型编号(4624/4769/4662/Sysmon EID1…)。类型键，非唯一，不可当强键。"}}, "layers": {"L1_object": {"title": "观测事实层 · 对象", "desc": "状态/可复用实体，被事件引用", "color": "#2563eb"}, "L1_event": {"title": "观测事实层 · 事件", "desc": "动作，带 Observation 元字段 + event_uid + event_code", "color": "#0891b2"}, "L2_resource": {"title": "资源对象层", "desc": "稳定被引用体，跨事件去重", "color": "#7c3aed"}, "L3_enrichment": {"title": "富化知识层", "desc": "进图，图上可关联查证", "color": "#16a34a"}, "L4_verdict": {"title": "研判产物层", "desc": "研判/推理输出，非事实", "color": "#dc2626"}}, "node_groups": {"@observable": ["Host", "Account", "Process", "File", "RegistryKey", "Ticket", "LogonSession", "AuthEvent", "DirectoryAccess", "DnsQuery", "NetworkFlow", "HttpRequest", "FileWriteEvent", "RegistryEvent", "WafHit"]}, "nodes": [{"name": "Host", "layer": "L1_object", "keys": ["asset_id"], "props": ["hostname", "os", "role", "criticality", "zone"], "note": "IP 经 HAS_IP 边，不用数组"}, {"name": "Account", "layer": "L1_object", "keys": ["sid", "upn"], "props": ["sid", "sam", "upn", "domain", "type"], "temporal_state_props": ["privileged", "spn", "delegation_flag", "preauth_flag"], "note": "可变状态属性带时效"}, {"name": "Process", "layer": "L1_object", "keys": ["process_guid"], "carries_obs": true, "props": ["process_guid", "pid", "image", "command_line", "start_time"]}, {"name": "File", "layer": "L1_object", "keys": ["sha256"], "carries_obs": true, "props": ["path", "md5", "sha256"]}, {"name": "RegistryKey", "layer": "L1_object", "keys": ["hive", "key_path", "value_name"], "props": ["hive", "key_path", "value_name"], "note": "状态对象；改动经 RegistryEvent"}, {"name": "Ticket", "layer": "L1_object", "keys": ["ticket_id", "ticket_hash"], "props": ["ticket_id", "ticket_hash", "kind", "client_account", "service_spn", "enc_type", "issue_time", "expire_time", "renew_until", "flags", "s4u_flag", "forwardable"], "note": "凭据对象，可被 PtT 复用；不承载请求动作"}, {"name": "LogonSession", "layer": "L1_object", "keys": ["logon_id", "logon_guid"], "props": ["logon_id", "logon_guid", "logon_type", "start_time"]}, {"name": "AuthEvent", "layer": "L1_event", "keys": ["event_uid"], "carries_obs": true, "props": ["event_code", "event_uid", "auth_type", "protocol", "logon_type", "status", "failure_reason"]}, {"name": "DirectoryAccess", "layer": "L1_event", "keys": ["event_uid"], "carries_obs": true, "props": ["event_code", "event_uid", "access_mask", "properties", "operation"]}, {"name": "DnsQuery", "layer": "L1_event", "keys": ["event_uid"], "carries_obs": true, "props": ["event_uid", "query", "query_type", "answers", "rcode", "ttl", "resolver_ip"], "note": "resolver 经 SENT_TO 边，resolver_ip 属性冗余"}, {"name": "NetworkFlow", "layer": "L1_event", "keys": ["event_uid"], "carries_obs": true, "props": ["event_uid", "src_port", "dst_port", "proto", "bytes", "start", "end"], "note": "src/dst 经 FROM_IP/TO_IP 边"}, {"name": "HttpRequest", "layer": "L1_event", "keys": ["event_uid"], "carries_obs": true, "props": ["event_uid", "method", "host_header", "user_agent", "params"]}, {"name": "FileWriteEvent", "layer": "L1_event", "keys": ["event_uid"], "carries_obs": true, "props": ["event_uid", "path", "operation", "time"]}, {"name": "RegistryEvent", "layer": "L1_event", "keys": ["event_uid"], "carries_obs": true, "props": ["event_uid", "event_code", "operation", "key_path", "value_name", "value_data", "time"]}, {"name": "WafHit", "layer": "L1_event", "keys": ["event_uid"], "carries_obs": true, "props": ["event_uid", "rule_id", "severity", "payload"]}, {"name": "IPAddress", "layer": "L2_resource", "keys": ["ip"], "props": ["ip", "version", "type", "geo", "asn", "reputation", "first_seen", "last_seen"], "note": "ip 为弱键(SNAT/NAT 干扰)"}, {"name": "Domain", "layer": "L2_resource", "keys": ["fqdn"], "props": ["fqdn", "first_seen", "reputation"]}, {"name": "Uri", "layer": "L2_resource", "keys": ["host", "path"], "props": ["path", "host"]}, {"name": "Service", "layer": "L2_resource", "keys": ["service_id"], "props": ["service_id", "name", "kind", "port", "protocol", "host_header"]}, {"name": "Application", "layer": "L2_resource", "keys": ["app_id"], "props": ["app_id", "name", "system", "owner"], "note": "扩展对象"}, {"name": "DirectoryObject", "layer": "L2_resource", "keys": ["guid", "dn"], "props": ["dn", "guid", "object_class"]}, {"name": "IoC", "layer": "L3_enrichment", "keys": ["kind", "value"], "props": ["kind", "value", "reputation", "source"]}, {"name": "Technique", "layer": "L3_enrichment", "keys": ["attack_id"], "props": ["attack_id", "tactic"]}, {"name": "AssetProfile", "layer": "L3_enrichment", "props": ["criticality", "owner", "os", "patch", "zone"], "temporal_validity": true, "note": "每 Host"}, {"name": "IdentityBaseline", "layer": "L3_enrichment", "props": ["role", "dept", "usual_hours", "geo", "history"], "temporal_validity": true, "note": "每 Account"}, {"name": "BusinessBaseline", "layer": "L3_enrichment", "props": ["expected_callers", "param_shapes", "normal_methods", "volume_baseline", "timing"], "temporal_validity": true, "note": "每 Service/Uri 的正常业务基线：判'是否正常业务'的正向依据(区别于历史判定)"}, {"name": "Alert", "layer": "L4_verdict", "keys": ["pattern_key"], "props": ["source", "rule_id", "severity", "pattern_key", "techniques", "raw_ref", "time"], "note": "pattern_key 为 IP 无关指纹(非事实键)；techniques[] 冗余快照，权威以 MAPS_TO 边为准"}, {"name": "ActivityCluster", "layer": "L4_verdict", "keys": ["cluster_id"], "props": ["cluster_id", "strategy", "confidence", "time_range", "features"], "note": "聚类结果，非真实攻击者身份"}, {"name": "Case", "layer": "L4_verdict", "keys": ["case_id"], "props": ["case_id", "verdict", "confidence", "timeline", "created_at"], "note": "研判工件(Alert→Case)；经验来源；一期最小落库"}, {"name": "Finding", "layer": "L4_verdict", "keys": ["finding_id"], "props": ["finding_id", "statement", "confidence"], "note": "研判结论；一期最小落库"}, {"name": "Experience", "layer": "L4_verdict", "keys": ["exp_id"], "props": ["exp_id", "title", "scenario", "verdict_pattern", "evidence_pattern", "false_positive_reason", "true_positive_reason", "handling_advice", "applicable_conditions", "exclusion_conditions", "confidence", "source_case"], "temporal_validity": true, "note": "历史经验(经验复用核心)：结构化字段做图召回 + 经验文本走 RAG + Agent 判适用"}, {"name": "AttackPattern", "layer": "L3_enrichment", "keys": ["pattern_id", "pattern_key"], "props": ["pattern_id", "pattern_key", "tier", "attack_type", "technique_ids", "normalized_uri", "method", "param_keys", "payload_features", "waf_rule_ids", "file_write_features"], "note": "攻击模式(组合特征，非单字段)：相似召回的锚。全场景：tier 区分层，应用层字段如示例，主机/身份/网络层各加自己特征"}], "edges": [{"name": "PARENT_OF", "from": "Process", "to": "Process", "category": "structural"}, {"name": "ON_HOST", "from": "Process", "to": "Host", "category": "structural"}, {"name": "RAN_AS", "from": "Process", "to": "Account", "category": "structural"}, {"name": "ON_HOST", "from": "File", "to": "Host", "category": "structural"}, {"name": "ON_HOST", "from": "RegistryKey", "to": "Host", "category": "structural"}, {"name": "ON_HOST", "from": "Service", "to": "Host", "category": "structural"}, {"name": "BELONGS_TO", "from": "Service", "to": "Application", "category": "structural"}, {"name": "HAS_IP", "from": "Host", "to": "IPAddress", "category": "structural", "props": ["first_seen", "last_seen", "source"]}, {"name": "PERFORMED", "from": "Account", "to": "AuthEvent", "category": "auth"}, {"name": "OBSERVED_ON", "from": "AuthEvent", "to": "Host", "category": "auth", "note": "事件记录在哪台"}, {"name": "FROM_IP", "from": "AuthEvent", "to": "IPAddress", "category": "auth"}, {"name": "FROM_HOST", "from": "AuthEvent", "to": "Host", "category": "auth", "note": "认证来源"}, {"name": "TARGET_HOST", "from": "AuthEvent", "to": "Host", "category": "auth", "note": "认证目标"}, {"name": "TARGET_SERVICE", "from": "AuthEvent", "to": "Service", "category": "auth"}, {"name": "ESTABLISHED", "from": "AuthEvent", "to": "LogonSession", "category": "auth"}, {"name": "REQUESTED", "from": "AuthEvent", "to": "Ticket", "category": "auth"}, {"name": "ISSUED", "from": "AuthEvent", "to": "Ticket", "category": "auth"}, {"name": "FOR_SERVICE", "from": "Ticket", "to": ["Account", "Service"], "category": "auth"}, {"name": "AUTHENTICATED_AS", "from": "LogonSession", "to": "Account", "category": "auth"}, {"name": "ON_HOST", "from": "LogonSession", "to": "Host", "category": "auth"}, {"name": "WROTE", "from": "Process", "to": "FileWriteEvent", "category": "access"}, {"name": "WROTE_FILE", "from": "FileWriteEvent", "to": "File", "category": "access"}, {"name": "ON_HOST", "from": "FileWriteEvent", "to": "Host", "category": "access"}, {"name": "MODIFIED", "from": "Process", "to": "RegistryEvent", "category": "access"}, {"name": "TARGETS", "from": "RegistryEvent", "to": "RegistryKey", "category": "access"}, {"name": "ON_HOST", "from": "RegistryEvent", "to": "Host", "category": "access"}, {"name": "PERFORMED", "from": "Account", "to": "DirectoryAccess", "category": "access"}, {"name": "TARGETS", "from": "DirectoryAccess", "to": "DirectoryObject", "category": "access"}, {"name": "ON_HOST", "from": "DirectoryAccess", "to": "Host", "category": "access", "note": "DC"}, {"name": "OPENED", "from": "Process", "to": "NetworkFlow", "category": "network"}, {"name": "FROM_IP", "from": "NetworkFlow", "to": "IPAddress", "category": "network"}, {"name": "TO_IP", "from": "NetworkFlow", "to": "IPAddress", "category": "network"}, {"name": "TO_HOST", "from": "NetworkFlow", "to": "Host", "category": "network"}, {"name": "MADE_DNS_QUERY", "from": ["Host", "Process"], "to": "DnsQuery", "category": "network"}, {"name": "SENT_TO", "from": "DnsQuery", "to": "IPAddress", "category": "network", "note": "resolver"}, {"name": "QUERIED", "from": "DnsQuery", "to": "Domain", "category": "network"}, {"name": "RESOLVES_TO", "from": "Domain", "to": "IPAddress", "category": "network"}, {"name": "FROM", "from": "HttpRequest", "to": "IPAddress", "category": "app"}, {"name": "TARGETS", "from": "HttpRequest", "to": ["Uri", "Service"], "category": "app"}, {"name": "TO_DEST", "from": "HttpRequest", "to": ["Host", "IPAddress"], "category": "app", "note": "跨层缝合"}, {"name": "ON", "from": "WafHit", "to": "HttpRequest", "category": "app"}, {"name": "CORRELATED_WITH", "from": "HttpRequest", "to": "FileWriteEvent", "category": "app"}, {"name": "MAPS_TO", "from": "Alert", "to": "Technique", "category": "mapping"}, {"name": "MATCHES", "from": "IoC", "to": ["IPAddress", "Domain", "File"], "category": "mapping"}, {"name": "HAS_PROFILE", "from": "Host", "to": "AssetProfile", "category": "mapping"}, {"name": "HAS_BASELINE", "from": "Account", "to": "IdentityBaseline", "category": "mapping"}, {"name": "HAS_BASELINE", "from": "Service", "to": "BusinessBaseline", "category": "mapping"}, {"name": "HAS_BASELINE", "from": "Uri", "to": "BusinessBaseline", "category": "mapping"}, {"name": "DERIVED_FROM", "from": "LogonSession", "to": "LogonSession", "category": "inference", "props": ["confidence", "evidence_keys", "correlation_rule", "time_window"], "note": "跨机横向，推理非事实"}, {"name": "GROUPS", "from": "ActivityCluster", "to": "@observable", "category": "inference", "props": ["strategy", "confidence"]}, {"name": "ABOUT", "from": "Alert", "to": "@observable", "category": "inference"}, {"name": "ABOUT", "from": "Case", "to": "Alert", "category": "verdict"}, {"name": "HAS_FINDING", "from": "Case", "to": "Finding", "category": "verdict"}, {"name": "SUPPORTED_BY", "from": "Finding", "to": "@observable", "category": "verdict"}, {"name": "MAPS_TO", "from": "Finding", "to": "Technique", "category": "verdict"}, {"name": "DERIVED_FROM", "from": "Experience", "to": "Case", "category": "experience"}, {"name": "HAS_FINDING", "from": "Experience", "to": "Finding", "category": "experience"}, {"name": "APPLIES_TO", "from": "Experience", "to": ["Alert", "Technique", "Service", "Uri"], "category": "experience"}, {"name": "HAS_EVIDENCE", "from": "Experience", "to": "@observable", "category": "experience"}, {"name": "MATCHES_PATTERN", "from": "Experience", "to": "AttackPattern", "category": "experience"}, {"name": "MATCHES_PATTERN", "from": "Alert", "to": "AttackPattern", "category": "experience"}, {"name": "MATCHES_PATTERN", "from": "HttpRequest", "to": "AttackPattern", "category": "experience", "note": "全场景：其他观测事件同理可 MATCHES_PATTERN"}], "connection_keys": {"strong": ["event_uid", "logon_guid", "process_guid", "sid/upn", "asset_id"], "weak": ["ip", "target-ip"], "event_type": ["event_code", "event_type"], "temporal_rules": ["timestamp + SEQ within N"], "derived_fingerprints": ["pattern_key", "attack_technique_id"]}, "edge_categories": {"structural": {"label": "归属/结构", "color": "#64748b"}, "auth": {"label": "认证", "color": "#0891b2"}, "access": {"label": "访问/写入", "color": "#d97706"}, "network": {"label": "网络", "color": "#2563eb"}, "app": {"label": "应用", "color": "#7c3aed"}, "mapping": {"label": "映射/富化", "color": "#16a34a"}, "inference": {"label": "推理(带置信度)", "color": "#dc2626"}, "verdict": {"label": "研判产物", "color": "#e11d48"}, "experience": {"label": "经验复用", "color": "#ca8a04"}}, "alert_coverage": [{"alert": "Kerberoast", "path": "Account(spn) -PERFORMED- AuthEvent(TGS-REQ,RC4) -REQUESTED- Ticket(TGS); 4769", "ok": true}, {"alert": "AS-REP Roast", "path": "Account(preauth_flag=off) -AuthEvent(AS-REQ)- -ISSUED- Ticket(AS-REP); 4768", "ok": true}, {"alert": "Pass-the-Ticket", "path": "AuthEvent(用 TGS 无前置 TGT, 时序规则) + LogonSession + logon_id", "ok": true}, {"alert": "Pass-the-Hash", "path": "AuthEvent(NTLM, logon_type 3/9, 无交互) + LogonSession", "ok": true}, {"alert": "DCSync", "path": "DirectoryAccess(replication, DS-Repl-Get-Changes) -TARGETS- DirectoryObject -ON_HOST- DC; 4662", "ok": true}, {"alert": "NTLM relay", "path": "AuthEvent(NTLM) -FROM_HOST/FROM_IP- + -TARGET_HOST- + -TARGET_SERVICE- + NetworkFlow", "ok": true}, {"alert": "委派滥用", "path": "AuthEvent(S4U2Self/Proxy) + Ticket(s4u_flag) + Account(delegation_flag)", "ok": true}, {"alert": "Webshell", "path": "HttpRequest -TARGETS- Service + WafHit ON; Process -WROTE- FileWriteEvent -WROTE_FILE- File; -CORRELATED_WITH-", "ok": true}, {"alert": "注册表持久化", "path": "Process -MODIFIED- RegistryEvent(set) -TARGETS- RegistryKey -ON_HOST- Host", "ok": true}, {"alert": "DNS beacon", "path": "DnsQuery(query_type/rcode/周期) -SENT_TO- resolver + -QUERIED- Domain + IoC(域信誉)", "ok": true}, {"alert": "服务执行", "path": "Process -PARENT_OF-(services.exe→cmd.exe) + command_line", "ok": true}, {"alert": "横向移动", "path": "LogonSession -DERIVED_FROM-{confidence} LogonSession + AuthEvent(远程登录) + logon_guid", "ok": true}]};
if (typeof cytoscape === 'undefined') { document.getElementById('warn').style.display='block'; }

const LAYER_ORDER = ["L1_object","L1_event","L2_resource","L3_enrichment","L4_verdict"];
const elements = [];

// 层（compound 父节点）
LAYER_ORDER.forEach(lk => {
  const L = MODEL.layers[lk];
  if (L) elements.push({ data:{ id:'layer:'+lk, label:L.title, isLayer:1, color:L.color } });
});

// 实体节点（preset 位置：按层分带）
const byLayer = {};
MODEL.nodes.forEach(n => { (byLayer[n.layer] = byLayer[n.layer]||[]).push(n); });
const COL_W = 200, ROW_H = 240, X0 = 130, Y0 = 130;
LAYER_ORDER.forEach((lk, li) => {
  (byLayer[lk]||[]).forEach((n, i) => {
    elements.push({
      data:{ id:n.name, label:n.name, parent:'layer:'+lk, layer:lk,
             color:(MODEL.layers[lk]||{}).color, deferred:n.deferred?1:0,
             keys:(n.keys||[]).join(', '), props:(n.props||[]).join(', '),
             tstate:(n.temporal_state_props||[]).join(', '),
             obs:n.carries_obs?1:0, note:n.note||'' },
      position:{ x:X0 + i*COL_W, y:Y0 + li*ROW_H }
    });
  });
});

// 边（展开 数组/@observable）
function tgts(to){ if(Array.isArray(to)) return to; if(to==='@observable') return ['layer:L1_object','layer:L1_event']; return [to]; }
function srcs(f){ return Array.isArray(f)? f : [f]; }
let eid=0;
MODEL.edges.forEach(e=>{
  const cat = (MODEL.edge_categories||{})[e.category] || {color:'#999'};
  srcs(e.from).forEach(s=> tgts(e.to).forEach(t=>{
    elements.push({ data:{ id:'e'+(eid++), source:s, target:t, label:e.name,
      category:e.category, color:cat.color, deferred:e.deferred?1:0 } });
  }));
});

let cy;
if (typeof cytoscape !== 'undefined') {
cy = cytoscape({
  container: document.getElementById('cy'),
  elements,
  boxSelectionEnabled:false,
  style:[
    { selector:'node[isLayer]', style:{ 'background-color':'data(color)','background-opacity':0.05,
      'border-color':'data(color)','border-width':2,'shape':'round-rectangle','label':'data(label)',
      'text-valign':'top','text-halign':'center','font-size':15,'font-weight':'bold','color':'data(color)','padding':22 } },
    { selector:'node[!isLayer]', style:{ 'background-color':'data(color)','label':'data(label)','color':'#fff',
      'font-size':12,'text-valign':'center','text-halign':'center','shape':'round-rectangle',
      'width':'label','height':30,'padding':10,'text-wrap':'wrap','border-width':0 } },
    { selector:'node[deferred=1]', style:{ 'background-opacity':0.4,'border-style':'dashed','border-width':2,'border-color':'#9ca3af' } },
    { selector:'edge', style:{ 'width':1.4,'line-color':'data(color)','target-arrow-color':'data(color)',
      'target-arrow-shape':'triangle','curve-style':'bezier','label':'data(label)','font-size':9,'color':'#334155',
      'text-background-color':'#fff','text-background-opacity':0.85,'text-background-padding':2,'arrow-scale':0.85 } },
    { selector:'edge[deferred=1]', style:{ 'line-style':'dashed','opacity':0.45 } },
    { selector:'.dim', style:{ 'opacity':0.08 } },
    { selector:'.hl', style:{ 'opacity':1 } }
  ],
  layout:{ name:'preset', fit:true, padding:30 }
});

cy.on('tap','node[!isLayer]', evt=>{
  const d = evt.target.data();
  document.getElementById('nodeinfo').innerHTML =
    '<div class="t">'+d.label+'</div>'+
    (d.keys?'<div class="row"><span class="k">键:</span> '+d.keys+'</div>':'')+
    (d.props?'<div class="row"><span class="k">属性:</span> '+d.props+'</div>':'')+
    (d.tstate?'<div class="row"><span class="k">时效状态属性:</span> '+d.tstate+'</div>':'')+
    (d.obs?'<div class="row"><span class="k">含 Observation 元字段</span></div>':'')+
    (d.note?'<div class="row"><span class="k">备注:</span> '+d.note+'</div>':'');
});
}

// 侧栏：层
const layersDiv = document.getElementById('layers');
LAYER_ORDER.forEach(lk=>{ const L=MODEL.layers[lk]; if(!L) return;
  const s=document.createElement('div'); s.className='row';
  s.innerHTML='<span class="chip" style="background:'+L.color+'">'+L.title+'</span> <span class="k">'+L.desc+'</span>';
  layersDiv.appendChild(s);
});

// 侧栏：边类型过滤
const cats = MODEL.edge_categories||{};
const catsDiv = document.getElementById('cats');
Object.keys(cats).forEach(ck=>{ const c=cats[ck];
  const l=document.createElement('label'); l.className='f';
  l.innerHTML='<input type="checkbox" data-cat="'+ck+'" checked/><span class="swatch" style="background:'+c.color+'"></span>'+c.label+' ('+ck+')';
  catsDiv.appendChild(l);
});
function applyFilters(){
  if(!cy) return;
  const on={}; document.querySelectorAll('#cats input').forEach(i=> on[i.dataset.cat]=i.checked);
  const showDef = document.getElementById('showDeferred').checked;
  cy.batch(()=>{
    cy.edges().forEach(e=>{ const d=e.data();
      const vis = (on[d.category]!==false) && (showDef || !d.deferred);
      e.style('display', vis?'element':'none');
    });
    cy.nodes('[deferred=1]').forEach(n=> n.style('display', showDef?'element':'none'));
  });
}
document.querySelectorAll('#cats input, #showDeferred').forEach(i=> i.addEventListener('change', applyFilters));
applyFilters();

// 侧栏：连接键
const ck = MODEL.connection_keys||{};
document.getElementById('keys').innerHTML =
  '<div class="row"><b>强键</b>: '+(ck.strong||[]).join(', ')+'</div>'+
  '<div class="row"><b>弱键</b>: '+(ck.weak||[]).join(', ')+'</div>'+
  '<div class="row"><b>事件类型键</b>: '+(ck.event_type||[]).join(', ')+' <span class="k">(非唯一,不可当强键)</span></div>'+
  '<div class="row"><b>时序规则</b>: '+(ck.temporal_rules||[]).join(', ')+'</div>'+
  '<div class="row"><b>派生指纹</b>: '+(ck.derived_fingerprints||[]).join(', ')+'</div>';

// 侧栏：告警覆盖
document.getElementById('cov').innerHTML = (MODEL.alert_coverage||[]).map(c=>
  '<div class="cov"><span class="ok">✓</span> <b>'+c.alert+'</b> <span class="k">— '+c.path+'</span></div>').join('');
</script>
</body>
</html>
